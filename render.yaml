# Render Blueprint: the whole deployment as code (ADR 0021, docs/deployment.md).
#
# Four resources on the free tier, in one EU region: the API and the UI as two web services built
# from the same image, Postgres with pgvector and Key Value (Redis). Every push to `main`
# redeploys both services; Render keeps the previous deploys, which is the rollback.
#
# The only values a person types are the two provider keys (`sync: false`). The API key and the
# service token are generated by Render and copied into the UI, so no secret lives in the repository
# or in the CI pipeline.

services:
  - type: web
    name: ai4devs-rental-api-ag
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    # Liveness only: a platform restarts on failure, so the probe must not touch the database.
    healthCheckPath: /health
    # No maxShutdownDelaySeconds: the free tier rejects it, so a deploy gives a review in flight
    # only the platform's default window to finish (ADR 0021).
    envVars:
      - key: ENVIRONMENT
        value: production
      # Rebuild the corpus from the BOE on start-up: the free database can be replaced, and the
      # corpus is derived data. Idempotent, so a routine restart costs nothing.
      - key: BOOTSTRAP_CORPUS
        value: "true"
      - key: API_KEY
        generateValue: true
      - key: SERVICE_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DAILY_SPEND_CAP_USD
        value: "2.0"
      - key: DATABASE_URL
        fromDatabase:
          name: ai4devs-rental-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai4devs-rental-cache
          property: connectionString

  - type: web
    name: ai4devs-rental-ui-ag
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    # A plain command, with no quotes and no variables: Render ran the quoted `sh -c "..."` form as
    # one word ("exec streamlit run ...: not found"). 10000 is the port Render gives web services.
    dockerCommand: streamlit run streamlit_app.py --server.port 10000 --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      # Free web services cannot receive private network traffic, so the UI calls the API at its
      # public address, with the token and the key that make that address useless to anyone else.
      - key: API_URL
        value: https://ai4devs-rental-api-ag.onrender.com
      - key: API_KEY
        fromService:
          type: web
          name: ai4devs-rental-api-ag
          envVarKey: API_KEY
      - key: SERVICE_TOKEN
        fromService:
          type: web
          name: ai4devs-rental-api-ag
          envVarKey: SERVICE_TOKEN

  - type: keyvalue
    name: ai4devs-rental-cache
    plan: free
    region: frankfurt
    # Empty: reachable only from the private network, never from the internet.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: ai4devs-rental-db
    plan: free
    region: frankfurt
    databaseName: rental
    user: rental
    postgresMajorVersion: "17"
    # Empty: reachable only from the private network, never from the internet.
    ipAllowList: []
