# The UI's accent colour. Streamlit's default primary colour is red (#FF4B4B), and it is also the
# colour of a focused field: a field you are typing in looked like a field with an error. Errors
# keep their own red (st.error does not use the primary colour).
#
# One accent per theme, so each viewer keeps their system's light or dark mode: a bright yellow
# stands out on dark, and a darker amber keeps a focus outline visible on white (3:1 or more).

[theme.light]
primaryColor = "#B7791F"

[theme.dark]
primaryColor = "#F2C94C"
