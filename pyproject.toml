[project]
name = "rental-assistant"
version = "0.1.0"
description = "Rental listing quality and compliance assistant (LIDR AI Engineering final project)"
readme = "README.md"
requires-python = ">=3.12"
# Exact pins for the LLM toolchain: a compromised or breaking release of these
# packages reaches production silently. Bump them deliberately, never by resolution.
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor==1.17.0",
    "jinja2==3.1.6",
    "litellm==1.102.0",
    "openai>=2.54.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The BOE marks list items with an en dash, which the parsers match literally.
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app", "benchmarks", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
