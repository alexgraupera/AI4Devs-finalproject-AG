[project]
name = "rental-assistant"
version = "0.1.0"
description = "Rental listing quality and compliance assistant (LIDR AI Engineering final project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rental_assistant"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The BOE marks list items with an en dash, which the parsers match literally.
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rental_assistant", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
