  # Looks excessive and is not: one month of deposit plus two of additional guarantee is exactly
  # what LAU art. 36.5 allows in a contract of up to five years.
  - id: clean-guarantee-at-the-limit
    tags: [clean, trap]
    listing:
      text: >-
        Piso de 2 habitaciones en Delicias (Zaragoza), 70 m² útiles, amueblado. 800 €/mes, comunidad
        incluida; suministros a cargo del inquilino. Se pide una mensualidad de fianza y una garantía
        adicional de dos mensualidades para un contrato de cinco años. Sin honorarios para el
        inquilino. Certificado energético D.
      price_eur_month: 800
      usable_surface_m2: 70
      rooms: 2
      municipality: Zaragoza
      energy_rating: D
    expected_legal: []
    expected_verdict: approve

