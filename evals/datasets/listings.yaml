# Annotated rental listings for evaluating the reviews (#49) and the agent vs the pipeline (#52).
#
# Built as docs/data-sources/listings-test-set.md describes: realistic properties, descriptions
# written for the test set, no personal data except in the case that tests the PII guardrail.
# Every expected legal finding names the article that backs it, checked against the BOE text.
#
# `expected_legal` lists the articles a correct review must cite, as "law art. N" (the paragraph is
# not compared: LAU art. 36.1 and art. 36.5 are both "LAU art. 36"). Quality findings (style, vague
# descriptions) are not scored: they are subjective, and scoring them would reward verbosity.
# `expected_error` marks the cases the service must refuse, with the reason it must give.

listings:
  # ── Clean: any legal finding here is a false positive ───────────────────────────────────
  - id: clean-valencia
    tags: [clean]
    listing:
      text: >-
        Piso de 3 habitaciones y 2 baños en Ruzafa (Valencia), 90 m² útiles, con balcón y aire
        acondicionado. Alquiler de 1.200 € al mes con los gastos de comunidad incluidos; los
        suministros (luz, agua y gas) los paga el inquilino. Fianza de una mensualidad. Sin gastos
        de agencia para el inquilino. Certificado energético C.
      price_eur_month: 1200
      usable_surface_m2: 90
      rooms: 3
      municipality: Valencia
      energy_rating: C
    expected_legal: []
    expected_verdict: approve

  - id: clean-sevilla
    tags: [clean]
    listing:
      text: >-
        Casa adosada en Nervión (Sevilla) de 4 dormitorios, 120 m² útiles, con patio y garaje.
        Precio: 1.500 €/mes, comunidad e IBI a cargo del propietario; suministros a cargo del
        inquilino. Fianza de un mes. Los honorarios de la agencia los paga la propiedad.
        Calificación energética: E.
      price_eur_month: 1500
      usable_surface_m2: 120
      rooms: 4
      municipality: Sevilla
      energy_rating: E
    expected_legal: []
    expected_verdict: approve

