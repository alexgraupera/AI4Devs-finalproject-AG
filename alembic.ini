# Alembic configuration. The database URL is not here on purpose: `migrations/env.py` reads it
# from the application settings, so `DATABASE_URL` is the only place that says where the
# database is.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Revisions are numbered by hand (0001, 0002...) so the order of the corpus schema is readable
# in the file listing, not only in the revision graph.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
