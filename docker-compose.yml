services:
  api:
    build: .
    # The schema is brought up to date before the first request, never by hand: a container
    # that starts is a container whose database matches the code it is running.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://cache:6379/0
      DATABASE_URL: postgresql+asyncpg://rental:rental@db:5432/rental
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  # Internal only: no ports. The cache is an optimisation, not an interface.
  cache:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The corpus store. The port is published because inspecting what was ingested with psql is
  # part of working on the RAG layer, unlike the cache, which is never read by hand.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental
    ports:
      - "5432:5432"
    volumes:
      - corpus:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  corpus:
