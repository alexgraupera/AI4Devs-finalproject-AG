services:
  api:
    build: .
    # The entrypoint brings the schema up to date before the first request, never by hand: a
    # container that starts is a container whose database matches the code it is running.
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://cache:6379/0
      DATABASE_URL: postgresql+asyncpg://rental:rental@db:5432/rental
      API_KEY: ${API_KEY:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # The corpus is built from the BOE on start-up, as in production: without it, a first
      # `make up` answers every regulation question with "not found". Idempotent, so a restart
      # re-downloads only what the BOE changed; the first run embeds 380 fragments for ~$0.02.
      BOOTSTRAP_CORPUS: ${BOOTSTRAP_CORPUS:-true}
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    # Published on the loopback only: reachable from this machine, not from its network.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    # The UI holds the credentials a marketplace backend would, and nothing else: no provider
    # keys, no database. Compose reads them from `.env` in this directory.
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
      RAG_API_KEY: ${RAG_API_KEY:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      UI_USERNAME: ${UI_USERNAME:-}
      UI_PASSWORD: ${UI_PASSWORD:-}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

  # Internal only: no ports. The cache is an optimisation, not an interface.
  cache:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The corpus store. The port is published because inspecting what was ingested with psql is
  # part of working on the RAG layer, unlike the cache, which is never read by hand. Loopback
  # only: `5432:5432` would publish it on every interface, and Docker's rules bypass a host
  # firewall like UFW, so nobody would notice.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - corpus:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  corpus:
