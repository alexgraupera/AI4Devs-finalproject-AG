  - id: bilbao-surface-dropped
    kind: clause-changed
    a: >-
      Apartamento de 1 habitación en Indautxu, 50 m² útiles, recién pintado, con calefacción
      central. Fianza equivalente a un mes de renta. Certificado energético E. No se cobran
      honorarios al inquilino.
    b: >-
      Apartamento de 1 habitación en Indautxu, recién pintado, con calefacción central. Fianza
      equivalente a un mes de renta. Certificado energético E. No se cobran honorarios al
      inquilino.

  - id: chamberi-fees-to-tenant
    kind: clause-changed
    a: >-
      Piso exterior de 2 habitaciones en Chamberí, 65 m² útiles, totalmente reformado. Cocina
      equipada, calefacción individual de gas y ascensor. Fianza de una mensualidad. Los gastos de
      gestión los asume la propiedad. Certificado energético: E.
    b: >-
      Piso exterior de 2 habitaciones en Chamberí, 65 m² útiles, totalmente reformado. Cocina
      equipada, calefacción individual de gas y ascensor. Fianza de una mensualidad. Los gastos de
      gestión los asume el inquilino. Certificado energético: E.

  # ── Different flats: the easy negatives ───────────────────────────────────────────────────
